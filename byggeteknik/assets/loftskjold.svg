<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="Inter,system-ui,sans-serif"><rect width="560" height="250" fill="#FBF9F3"/><defs><marker id="aO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#D97B29"/></marker><marker id="aB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3E87C0"/></marker><pattern id="conc" patternUnits="userSpaceOnUse" width="14" height="14"><rect width="14" height="14" fill="#D8D3C8"/><circle cx="4" cy="5" r="1.2" fill="#a39d90"/><circle cx="10" cy="11" r="1.2" fill="#a39d90"/></pattern></defs><text x="280.0" y="32" font-size="14" fill="#23211C" text-anchor="middle" font-weight="700">Misfarvning af loft</text><text x="280" y="54" font-size="11" fill="#9a9281" text-anchor="middle" font-weight="500">Skjold = fugt fra utæt tag eller rør ovenover</text><line x1="280" y1="80" x2="280" y2="118" stroke="#3E87C0" stroke-width="2.4" marker-end="url(#aB)"/><rect x="80" y="124" width="400" height="18" fill="#EFE7D6" stroke="#23211C" stroke-width="1.4" rx="0"/><text x="120" y="116" font-size="10" fill="#9a9281" text-anchor="middle" font-weight="500">loft</text><ellipse cx="280" cy="178" rx="58" ry="29.0" fill="#caa066" stroke="none" stroke-width="0"/><ellipse cx="280" cy="178" rx="42" ry="21.0" fill="#bd8f52" stroke="none" stroke-width="0"/><ellipse cx="280" cy="178" rx="26" ry="13.0" fill="#a87a3e" stroke="none" stroke-width="0"/><ellipse cx="280" cy="178" rx="12" ry="6.0" fill="#8f6630" stroke="none" stroke-width="0"/><text x="280" y="232" font-size="10" fill="#9a9281" text-anchor="middle" font-weight="500">Friske, mørke skjolder = aktiv fugt. Gulnede = ældre/standset.</text></svg>