<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 160"><style>
.bs-canopy{transform-box:fill-box;transform-origin:50% 95%;animation:bsway 4.5s ease-in-out infinite}
.bs-pup{transform-box:fill-box;transform-origin:50% 100%;animation:bbob 3.2s ease-in-out infinite}
.bs-drink{transform-box:fill-box;transform-origin:50% 100%;animation:bbob 3.2s ease-in-out infinite .2s}
.bs-sun{transform-box:fill-box;transform-origin:center;animation:bsun 5s ease-in-out infinite}
.bs-waves{animation:bwave 6s linear infinite}
@keyframes bsway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
@keyframes bbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bsun{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes bwave{0%{transform:translateX(0)}100%{transform:translateX(-40px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
