name: Ejnar query planner experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ejnar/query_planner.py"
      - "ejnar/query_planner_runtime.py"
      - "ejnar/query_intent.py"
      - "ejnar/retrieval_runtime.py"
      - "ejnar/paragraph_*.py"
      - "ejnar/metadata_*.py"
      - "ejnar/query_feature_*.py"
      - "ejnar/specific_decision_runtime.py"
      - "ejnar/evaluation/run_query_planner_experiment.py"
      - "ejnar/evaluation/run_live_retrieval.py"
      - "ejnar/evaluation/run_retrieval.py"
      - "ejnar/evaluation/qrels_metrics.py"
      - "ejnar/evaluation/metrics.py"
      - "ejnar/evaluation/bootstrap_qrels_v2.csv"
      - "ejnar/evaluation/eval_questions.csv"
      - "ejnar/ejnar_*.csv.zip"
      - "ejnar/requirements.txt"
      - ".github/workflows/ejnar-query-planner-experiment.yml"

permissions:
  contents: read

concurrency:
  group: ejnar-query-planner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ejnar/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ejnar/requirements.txt

      - name: Run isolated planner benchmark
        run: |
          mkdir -p artifacts/ejnar-query-planner
          python -m ejnar.evaluation.run_query_planner_experiment \
            --top-k 20 \
            --output-dir artifacts/ejnar-query-planner

      - name: Publish comparison
        if: always()
        run: |
          if [ -f artifacts/ejnar-query-planner/comparison.md ]; then
            cat artifacts/ejnar-query-planner/comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/ejnar-query-planner/comparison.json ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/ejnar-query-planner")
          comparison = json.loads((root / "comparison.json").read_text())
          baseline = json.loads((root / "baseline-qrels-report.json").read_text())
          candidate = json.loads((root / "candidate-qrels-report.json").read_text())
          lines = [
              "",
              "### Planner policy",
              f"- Passed: {comparison.get('passed')}",
              "- Exact-content and specific-decision searches are never expanded.",
              "- The planner only adds retrieval terms; it never decides claim coverage.",
              f"- Baseline latency: {(baseline.get('run') or {}).get('mean_latency_ms')} ms",
              f"- Candidate latency: {(candidate.get('run') or {}).get('mean_latency_ms')} ms",
              f"- Effective queries changed: {(comparison.get('planner_effect') or {}).get('treated_queries')}",
              f"- Result lists changed: {(comparison.get('planner_effect') or {}).get('changed_result_lists')}",
              "- The frozen 31-query suite is a global regression guard, not evidence of short-query gain.",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejnar-query-planner-experiment
          path: artifacts/ejnar-query-planner
          if-no-files-found: error
          retention-days: 30
