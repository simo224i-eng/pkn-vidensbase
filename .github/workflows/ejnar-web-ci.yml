# CI for ejnar-web (Next.js + FastAPI). Kører kun når ejnar-web/ ændres.
#
# Backend-testene kører mod requirements.txt-pinnede versioner (fx pandas 2.3.x)
# — bevidst: udviklings-sandboxen kan have nyere versioner, og suiten skal
# fange netop den slags skew (NA-maskering i pandas 2.x er et konkret eksempel).
name: ejnar-web CI

on:
  push:
    branches: [main]
    paths: ["ejnar-web/**", ".github/workflows/ejnar-web-ci.yml"]
  pull_request:
    paths: ["ejnar-web/**", ".github/workflows/ejnar-web-ci.yml"]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ejnar-web/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ejnar-web/backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  frontend-build:
    name: Frontend (tsc + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ejnar-web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ejnar-web/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
