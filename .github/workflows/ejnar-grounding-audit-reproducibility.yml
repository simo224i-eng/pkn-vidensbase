name: Ejnar grounding audit reproducibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "shared.py"
      - "ejnar/shared.py"
      - "ejnar/deterministic_retrieval_runtime.py"
      - "ejnar/retrieval_runtime.py"
      - "ejnar/query_planner.py"
      - "ejnar/query_planner_runtime.py"
      - "ejnar/paragraph_*.py"
      - "ejnar/metadata_*.py"
      - "ejnar/query_feature_*.py"
      - "ejnar/specific_decision_runtime.py"
      - "ejnar/decision_grounding.py"
      - "ejnar/decision_grounding_runtime.py"
      - "ejnar/evaluation/run_live_retrieval.py"
      - "ejnar/evaluation/grounding_audit_pool.py"
      - "ejnar/evaluation/grounding_review.py"
      - "ejnar/evaluation/grounding_review_batches.py"
      - "ejnar/evaluation/grounding_audit_reproducibility.py"
      - "ejnar/evaluation/GROUNDING_REVIEW_PROTOCOL.md"
      - "ejnar/tests/test_grounding_*.py"
      - ".github/workflows/ejnar-grounding-audit-reproducibility.yml"
      - "ejnar/ejnar_*.csv"
      - "ejnar/ejnar_*.csv.zip"

permissions:
  contents: read

concurrency:
  group: ejnar-grounding-audit-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: audit-host-${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ejnar/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ejnar/requirements.txt

      - name: Run live retrieval
        run: |
          mkdir -p /tmp/ejnar-grounding-${{ matrix.host }}
          python -m ejnar.evaluation.run_live_retrieval \
            --top-k 12 \
            --results /tmp/ejnar-grounding-${{ matrix.host }}/retrieval.jsonl \
            --report /tmp/ejnar-grounding-${{ matrix.host }}/retrieval-report.json

      - name: Build blind audit pool
        run: |
          mkdir -p artifacts/grounding-repro/adjudication artifacts/grounding-repro/diagnostics
          python -m ejnar.evaluation.grounding_audit_pool \
            --results /tmp/ejnar-grounding-${{ matrix.host }}/retrieval.jsonl \
            --blind-output artifacts/grounding-repro/adjudication/blind-pool.jsonl \
            --diagnostics-output artifacts/grounding-repro/diagnostics/pool-diagnostics.jsonl \
            --summary-output artifacts/grounding-repro/diagnostics/summary.json \
            --top-results-per-query 10 \
            --max-pool 120 \
            --min-contrast 2.0

      - name: Prepare blind human review package
        run: |
          python -m ejnar.evaluation.grounding_review prepare \
            --source artifacts/grounding-repro/adjudication/blind-pool.jsonl \
            --csv artifacts/grounding-repro/adjudication/grounding-review.csv \
            --manifest artifacts/grounding-repro/adjudication/review-manifest.json
          cp ejnar/evaluation/GROUNDING_REVIEW_PROTOCOL.md \
            artifacts/grounding-repro/adjudication/REVIEW_PROTOCOL.md
          python -m ejnar.evaluation.grounding_review_batches split \
            --csv artifacts/grounding-repro/adjudication/grounding-review.csv \
            --output-dir artifacts/grounding-repro/adjudication/review-batches \
            --manifest artifacts/grounding-repro/adjudication/review-batches-manifest.json \
            --batch-size 15

      - name: Fingerprint adjudication package
        run: |
          python -m ejnar.evaluation.grounding_audit_reproducibility fingerprint \
            --adjudication-dir artifacts/grounding-repro/adjudication \
            --output artifacts/grounding-repro/fingerprint.json

      - name: Upload independent package fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: ejnar-grounding-repro-host-${{ matrix.host }}
          path: artifacts/grounding-repro
          if-no-files-found: error
          retention-days: 30

  compare-packages:
    needs: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download host 1 package
        uses: actions/download-artifact@v4
        with:
          name: ejnar-grounding-repro-host-1
          path: artifacts/host-1

      - name: Download host 2 package
        uses: actions/download-artifact@v4
        with:
          name: ejnar-grounding-repro-host-2
          path: artifacts/host-2

      - name: Download host 3 package
        uses: actions/download-artifact@v4
        with:
          name: ejnar-grounding-repro-host-3
          path: artifacts/host-3

      - name: Compare complete review-package fingerprints
        id: compare
        continue-on-error: true
        run: |
          python -m ejnar.evaluation.grounding_audit_reproducibility compare \
            --run host1=artifacts/host-1/fingerprint.json \
            --run host2=artifacts/host-2/fingerprint.json \
            --run host3=artifacts/host-3/fingerprint.json \
            --output artifacts/comparison.json

      - name: Publish reproducibility summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("artifacts/comparison.json")
          lines = ["## Ejnar grounding audit reproducibility"]
          if path.exists():
              report = json.loads(path.read_text(encoding="utf-8"))
              lines.extend([
                  f"- Exact package reproducibility: **{report['exact_reproducibility']}**",
                  f"- Independent hosts: {len(report['runs'])}",
                  f"- Differing components: {report['differing_fields'] or 'none'}",
              ])
              fp = json.loads(Path("artifacts/host-1/fingerprint.json").read_text(encoding="utf-8"))
              lines.extend([
                  f"- Review rows: {fp['rows']}",
                  f"- Review batches: {fp['batches']}",
                  f"- Blind source SHA-256: `{fp['blind_source_sha256']}`",
              ])
          else:
              lines.append("Comparison report was not produced.")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload package comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejnar-grounding-audit-reproducibility
          path: |
            artifacts/comparison.json
            artifacts/host-1/fingerprint.json
            artifacts/host-2/fingerprint.json
            artifacts/host-3/fingerprint.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail if review package is not exactly reproducible
        if: steps.compare.outcome == 'failure'
        run: |
          echo "Independent hosts produced different grounding review packages."
          exit 1
