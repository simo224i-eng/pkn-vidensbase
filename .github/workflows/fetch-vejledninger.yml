name: Hent vejledningstekster

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Genhent også vejledninger der allerede har fuld tekst"
        type: boolean
        default: false
      only:
        description: "Behandl kun vejledninger hvor URL indeholder denne streng (fx 'retsinformation')"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dependencies
        run: pip install requests beautifulsoup4 trafilatura pdfplumber

      - name: Hent vejledningstekster
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          echo "Kører: python3 fetch_vejledninger.py $ARGS"
          python3 fetch_vejledninger.py $ARGS

      - name: Vis statistik
        run: |
          python3 - <<'PY'
          import json, os, glob
          for f in sorted(glob.glob("vejledninger/*_vejledninger.json")):
              data = json.load(open(f))
              lens = [len(v.get("tekst","")) for v in data]
              full = sum(1 for l in lens if l >= 8000)
              print(f"{os.path.basename(f)}: {len(data)} vejl, {full} fulde, snit {sum(lens)//len(lens):,} tegn".replace(",", "."))
          PY

      - name: Commit og push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vejledninger/*.json
          if git diff --cached --quiet; then
            echo "Ingen ændringer at committe"
          else
            git commit -m "Auto-hent vejledningstekster via GitHub Action"
            git push
          fi
