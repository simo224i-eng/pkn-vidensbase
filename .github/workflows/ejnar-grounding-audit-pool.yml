name: Ejnar grounding audit pool

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ejnar/decision_grounding.py"
      - "ejnar/decision_grounding_runtime.py"
      - "ejnar/evaluation/grounding_audit_pool.py"
      - "ejnar/evaluation/grounding_review.py"
      - "ejnar/evaluation/GROUNDING_REVIEW_PROTOCOL.md"
      - "ejnar/tests/test_decision_grounding*.py"
      - "ejnar/tests/test_grounding_audit_pool.py"
      - "ejnar/tests/test_grounding_review.py"
      - ".github/workflows/ejnar-grounding-audit-pool.yml"
  push:
    branches: [main]
    paths:
      - "ejnar/decision_grounding.py"
      - "ejnar/decision_grounding_runtime.py"
      - "ejnar/evaluation/grounding_audit_pool.py"
      - "ejnar/evaluation/grounding_review.py"
      - "ejnar/evaluation/GROUNDING_REVIEW_PROTOCOL.md"
      - "ejnar/tests/test_decision_grounding*.py"
      - "ejnar/tests/test_grounding_audit_pool.py"
      - "ejnar/tests/test_grounding_review.py"
      - ".github/workflows/ejnar-grounding-audit-pool.yml"

permissions:
  contents: read

concurrency:
  group: ejnar-grounding-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audit-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ejnar/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ejnar/requirements.txt

      - name: Run current live retrieval
        run: |
          mkdir -p artifacts/grounding-audit/diagnostics
          python -m ejnar.evaluation.run_live_retrieval \
            --top-k 12 \
            --results artifacts/grounding-audit/diagnostics/retrieval-results.jsonl \
            --report artifacts/grounding-audit/diagnostics/retrieval-report.json

      - name: Build blind adjudication pool
        run: |
          mkdir -p artifacts/grounding-audit/adjudication
          python -m ejnar.evaluation.grounding_audit_pool \
            --results artifacts/grounding-audit/diagnostics/retrieval-results.jsonl \
            --blind-output artifacts/grounding-audit/adjudication/blind-pool.jsonl \
            --diagnostics-output artifacts/grounding-audit/diagnostics/pool-diagnostics.jsonl \
            --summary-output artifacts/grounding-audit/diagnostics/summary.json \
            --top-results-per-query 10 \
            --max-pool 120 \
            --min-contrast 2.0

      - name: Prepare human review package
        run: |
          python -m ejnar.evaluation.grounding_review prepare \
            --source artifacts/grounding-audit/adjudication/blind-pool.jsonl \
            --csv artifacts/grounding-audit/adjudication/grounding-review.csv \
            --manifest artifacts/grounding-audit/adjudication/review-manifest.json
          cp ejnar/evaluation/GROUNDING_REVIEW_PROTOCOL.md \
            artifacts/grounding-audit/adjudication/REVIEW_PROTOCOL.md

      - name: Validate blank review package structure
        run: |
          python -m ejnar.evaluation.grounding_review validate \
            --source artifacts/grounding-audit/adjudication/blind-pool.jsonl \
            --csv artifacts/grounding-audit/adjudication/grounding-review.csv \
            --report artifacts/grounding-audit/diagnostics/review-package-validation.json \
            --allow-incomplete

      - name: Publish diagnostic summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/grounding-audit/diagnostics/summary.json")
          lines = ["## Ejnar grounding audit pool"]
          if path.exists():
              summary = json.loads(path.read_text(encoding="utf-8"))
              lines.extend([
                  f"- Retrieval queries: {summary['retrieval_queries']}",
                  f"- Candidate pairs: {summary['candidate_pairs']}",
                  f"- Selected for blind review: {summary['selected_pairs']}",
                  f"- High priority: {summary['priority_counts'].get('high', 0)}",
                  f"- Medium priority: {summary['priority_counts'].get('medium', 0)}",
                  "",
                  "> Heuristic selection only. Human review labels are not inferred by the tool.",
                  "> The adjudication artifact contains a CSV review sheet and protocol with diagnostics kept separate.",
              ])
          else:
              lines.append("Audit summary was not produced.")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload blind adjudication artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejnar-grounding-audit-adjudication
          path: artifacts/grounding-audit/adjudication
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejnar-grounding-audit-diagnostics
          path: artifacts/grounding-audit/diagnostics
          if-no-files-found: error
          retention-days: 30
