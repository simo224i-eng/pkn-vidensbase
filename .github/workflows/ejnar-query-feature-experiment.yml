name: Ejnar query feature experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ejnar/query_feature_rerank.py"
      - "ejnar/metadata_*.py"
      - "ejnar/evaluation/run_query_feature_experiment.py"
      - "ejnar/evaluation/bootstrap_qrels_v2.csv"
      - "ejnar/evaluation/eval_questions.csv"
      - "ejnar/ejnar_*.csv.zip"
      - ".github/workflows/ejnar-query-feature-experiment.yml"

permissions:
  contents: read

concurrency:
  group: ejnar-query-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ejnar/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ejnar/requirements.txt

      - name: Run strength grid
        run: |
          mkdir -p artifacts/ejnar-query-feature
          python -m ejnar.evaluation.run_query_feature_experiment \
            --top-k 20 \
            --strengths 0,0.02,0.05,0.08,0.12 \
            --output-dir artifacts/ejnar-query-feature

      - name: Evaluate every run against frozen qrels v2
        run: |
          for result in artifacts/ejnar-query-feature/strength-*.jsonl; do
            stem="${result%.jsonl}"
            python -m ejnar.evaluation.qrels_metrics \
              --qrels ejnar/evaluation/bootstrap_qrels_v2.csv \
              --results "$result" \
              --output "${stem}-qrels-report.json"
          done
          cp ejnar/evaluation/bootstrap_qrels_v2.meta.json \
            artifacts/ejnar-query-feature/qrels_meta.json

      - name: Compare strengths
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/ejnar-query-feature")
          rows = []
          for path in sorted(root.glob("strength-*-qrels-report.json")):
              report = json.loads(path.read_text())
              summary = report.get("summary", {})
              strength = path.name.split("-qrels-report.json")[0].replace("strength-", "").replace("_", ".")
              rows.append({
                  "strength": float(strength),
                  "mrr": summary.get("mrr"),
                  "ndcg_at_10": summary.get("mean_ndcg_at_10"),
                  "recall_at_5": summary.get("mean_recall_at_5"),
                  "recall_at_10": summary.get("mean_recall_at_10"),
                  "judged_precision_at_5": summary.get("mean_judged_precision_at_5"),
                  "judged_precision_at_10": summary.get("mean_judged_precision_at_10"),
              })
          baseline = next((row for row in rows if row["strength"] == 0), None)
          for row in rows:
              if baseline:
                  row["delta_mrr"] = (row["mrr"] or 0) - (baseline["mrr"] or 0)
                  row["delta_ndcg_at_10"] = (row["ndcg_at_10"] or 0) - (baseline["ndcg_at_10"] or 0)
          (root / "comparison.json").write_text(json.dumps(rows, ensure_ascii=False, indent=2) + "\n")

          lines = [
              "## Query-feature rerank experiment",
              "",
              "| Strength | MRR | Δ MRR | NDCG@10 | Δ NDCG | Recall@5 | Judged P@5 |",
              "|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for row in rows:
              lines.append(
                  f"| {row['strength']:.2f} | {row['mrr']:.6f} | {row.get('delta_mrr', 0):+.6f} | "
                  f"{row['ndcg_at_10']:.6f} | {row.get('delta_ndcg_at_10', 0):+.6f} | "
                  f"{row['recall_at_5']:.6f} | {row['judged_precision_at_5']:.6f} |"
              )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejnar-query-feature-experiment
          path: artifacts/ejnar-query-feature
          if-no-files-found: error
          retention-days: 30
