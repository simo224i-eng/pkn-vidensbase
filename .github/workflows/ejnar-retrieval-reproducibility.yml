name: Ejnar retrieval reproducibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "shared.py"
      - "ejnar/shared.py"
      - "ejnar/deterministic_retrieval_runtime.py"
      - "ejnar/retrieval_runtime.py"
      - "ejnar/query_planner.py"
      - "ejnar/query_planner_runtime.py"
      - "ejnar/paragraph_runtime.py"
      - "ejnar/metadata_runtime.py"
      - "ejnar/query_feature_runtime.py"
      - "ejnar/query_feature_rerank.py"
      - "ejnar/specific_decision_runtime.py"
      - "ejnar/evaluation/run_live_retrieval.py"
      - "ejnar/evaluation/run_retrieval.py"
      - "ejnar/evaluation/run_pipeline_stage_trace.py"
      - "ejnar/evaluation/retrieval_reproducibility.py"
      - "ejnar/evaluation/pipeline_stage_reproducibility.py"
      - "ejnar/tests/test_retrieval_reproducibility.py"
      - ".github/workflows/ejnar-retrieval-reproducibility.yml"
      - "ejnar/ejnar_*.csv"
      - "ejnar/ejnar_*.csv.zip"

permissions:
  contents: read

concurrency:
  group: ejnar-retrieval-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval-run:
    name: retrieval-host-seed-${{ matrix.seed }}
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ejnar/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ejnar/requirements.txt

      - name: Run live retrieval on independent host
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
        run: |
          mkdir -p artifacts/reproducibility
          python -m ejnar.evaluation.run_live_retrieval \
            --top-k 20 \
            --results artifacts/reproducibility/seed-${{ matrix.seed }}.jsonl \
            --report artifacts/reproducibility/seed-${{ matrix.seed }}-report.json

      - name: Trace retrieval layers on independent host
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
        run: |
          python -m ejnar.evaluation.run_pipeline_stage_trace \
            --top-k 20 \
            --output artifacts/reproducibility/stage-${{ matrix.seed }}.jsonl

      - name: Upload host result
        uses: actions/upload-artifact@v4
        with:
          name: ejnar-repro-seed-${{ matrix.seed }}
          path: artifacts/reproducibility
          if-no-files-found: error
          retention-days: 30

  compare-hosts:
    needs: retrieval-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download host 1 result
        uses: actions/download-artifact@v4
        with:
          name: ejnar-repro-seed-1
          path: artifacts/reproducibility/host-1

      - name: Download host 2 result
        uses: actions/download-artifact@v4
        with:
          name: ejnar-repro-seed-2
          path: artifacts/reproducibility/host-2

      - name: Download host 3 result
        uses: actions/download-artifact@v4
        with:
          name: ejnar-repro-seed-3
          path: artifacts/reproducibility/host-3

      - name: Compare ordered decision results across hosts
        id: compare
        continue-on-error: true
        run: |
          python -m ejnar.evaluation.retrieval_reproducibility \
            --run host1=artifacts/reproducibility/host-1/seed-1.jsonl \
            --run host2=artifacts/reproducibility/host-2/seed-2.jsonl \
            --run host3=artifacts/reproducibility/host-3/seed-3.jsonl \
            --output artifacts/reproducibility/comparison.json

      - name: Locate first divergent runtime layer
        if: always()
        run: |
          python -m ejnar.evaluation.pipeline_stage_reproducibility \
            --run host1=artifacts/reproducibility/host-1/stage-1.jsonl \
            --run host2=artifacts/reproducibility/host-2/stage-2.jsonl \
            --run host3=artifacts/reproducibility/host-3/stage-3.jsonl \
            --output artifacts/reproducibility/stage-comparison.json

      - name: Print first divergent questions
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              rows = {}
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      row = json.loads(line)
                      rows[row["question_id"]] = row
              return rows

          hosts = {
              f"host{i}": load(f"artifacts/reproducibility/host-{i}/stage-{i}.jsonl")
              for i in (1, 2, 3)
          }
          shown = 0
          for qid in sorted(hosts["host1"]):
              rows = {name: data.get(qid) for name, data in hosts.items()}
              bases = {name: (row or {}).get("stages", {}).get("deterministic_base") for name, row in rows.items()}
              if len({json.dumps(b) for b in bases.values()}) == 1:
                  continue
              print(f"== {qid}")
              for name, row in rows.items():
                  row = row or {}
                  print(f"  {name} effective_query={row.get('effective_query')!r}")
                  print(f"  {name} base[:6]={(bases[name] or [])[:6]}")
              shown += 1
              if shown >= 4:
                  break
          PY

      - name: Publish summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/reproducibility/comparison.json")
          stage_path = Path("artifacts/reproducibility/stage-comparison.json")
          lines = ["## Ejnar retrieval reproducibility — separate runners"]
          if path.exists():
              report = json.loads(path.read_text(encoding="utf-8"))
              summary = report["summary"]
              lines.extend([
                  f"- Exact reproducibility: **{report['exact_reproducibility']}**",
                  f"- Independent GitHub runners: {summary['runs']}",
                  f"- Questions: {summary['questions']}",
                  f"- Affected unique questions: {summary['affected_unique_questions']}",
                  f"- Ordered mismatches: {summary['ordered_mismatches_across_comparisons']}",
                  f"- Candidate-set mismatches: {summary['set_mismatches_across_comparisons']}",
              ])
          else:
              lines.append("Comparison report was not produced.")
          if stage_path.exists():
              stage = json.loads(stage_path.read_text(encoding="utf-8"))
              lines.extend([
                  "",
                  "### First divergent layer",
                  f"- Affected questions: {stage['affected_questions']}",
                  f"- First-stage counts: {stage['first_divergent_stage_counts']}",
              ])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload cross-host comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejnar-retrieval-reproducibility
          path: artifacts/reproducibility
          if-no-files-found: error
          retention-days: 30

      - name: Fail if retrieval is not exactly reproducible
        if: steps.compare.outcome == 'failure'
        run: |
          echo "Independent GitHub runners produced different ordered retrieval results."
          exit 1
