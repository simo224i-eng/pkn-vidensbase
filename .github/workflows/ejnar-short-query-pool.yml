name: Ejnar short-query pool

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ejnar/shared.py"
      - "ejnar/query_intent.py"
      - "ejnar/query_planner.py"
      - "ejnar/query_planner_runtime.py"
      - "ejnar/retrieval_runtime.py"
      - "ejnar/paragraph_*.py"
      - "ejnar/metadata_*.py"
      - "ejnar/query_feature_*.py"
      - "ejnar/specific_decision_runtime.py"
      - "ejnar/evaluation/metrics.py"
      - "ejnar/evaluation/qrels_metrics.py"
      - "ejnar/evaluation/run_retrieval.py"
      - "ejnar/evaluation/run_live_retrieval.py"
      - "ejnar/evaluation/run_query_planner_experiment.py"
      - "ejnar/evaluation/run_short_query_experiment.py"
      - "ejnar/evaluation/short_query_*.py"
      - "ejnar/evaluation/short_query_questions_v1.csv"
      - "ejnar/evaluation/short_query_questions_v1.meta.json"
      - "ejnar/ejnar_*.csv.zip"
      - "ejnar/requirements.txt"
      - ".github/workflows/ejnar-short-query-pool.yml"

permissions:
  contents: read

concurrency:
  group: ejnar-short-query-pool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ejnar/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ejnar/requirements.txt

      - name: Verify frozen short-query dataset
        run: |
          python -m unittest \
            ejnar.tests.test_short_query_manifest \
            ejnar.tests.test_short_query_benchmark \
            ejnar.tests.test_short_query_metrics \
            ejnar.tests.test_run_short_query_experiment

      - name: Build blind baseline/candidate pool
        run: |
          mkdir -p artifacts/ejnar-short-query-pool
          python -m ejnar.evaluation.run_short_query_experiment \
            --pool-only \
            --minimum-treated-cohort-size 60 \
            --minimum-planner-applications 12 \
            --minimum-holdout-planner-applications 5 \
            --minimum-holdout-active-topics 5 \
            --top-k 30 \
            --pool-depth 30 \
            --output-dir artifacts/ejnar-short-query-pool

      - name: Publish summary
        if: always()
        run: |
          if [ -f artifacts/ejnar-short-query-pool/summary.md ]; then
            cat artifacts/ejnar-short-query-pool/summary.md \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload blinded adjudication pool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejnar-short-query-adjudication
          path: |
            artifacts/ejnar-short-query-pool/blind-pool.jsonl
            artifacts/ejnar-short-query-pool/integrity.json
            artifacts/ejnar-short-query-pool/summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload private retrieval diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejnar-short-query-diagnostics
          path: |
            artifacts/ejnar-short-query-pool/lexical-results.jsonl
            artifacts/ejnar-short-query-pool/baseline-results.jsonl
            artifacts/ejnar-short-query-pool/candidate-results.jsonl
            artifacts/ejnar-short-query-pool/pool-provenance.jsonl
            artifacts/ejnar-short-query-pool/planner-effect.json
          if-no-files-found: error
          retention-days: 30
