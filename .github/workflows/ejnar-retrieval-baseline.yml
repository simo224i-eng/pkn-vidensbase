name: Ejnar retrieval baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ejnar/query_intent.py"
      - "ejnar/retrieval_runtime.py"
      - "ejnar/paragraph_*.py"
      - "ejnar/metadata_*.py"
      - "ejnar/evaluation/**"
      - "ejnar/ejnar_*.csv.zip"
      - ".github/workflows/ejnar-retrieval-baseline.yml"

permissions:
  contents: read

concurrency:
  group: ejnar-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lexical-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ejnar/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ejnar/requirements.txt

      - name: Run live retrieval baseline
        run: |
          mkdir -p artifacts/ejnar-retrieval
          python -m ejnar.evaluation.run_live_retrieval \
            --top-k 20 \
            --results artifacts/ejnar-retrieval/results.jsonl \
            --report artifacts/ejnar-retrieval/report.json

      - name: Publish summary
        if: always()
        run: |
          if [ -f artifacts/ejnar-retrieval/report.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/ejnar-retrieval/report.json").read_text())
          summary = report.get("summary", {})
          run = report.get("run", {})
          lines = [
              "## Ejnar retrieval baseline",
              f"- Dokumenter: {run.get('documents')}",
              f"- Spørgsmål: {run.get('questions')}",
              f"- Pipeline: {run.get('pipeline')}",
              f"- Mean latency: {run.get('mean_latency_ms')} ms",
              f"- Recall@5: {summary.get('mean_recall_at_5')}",
              f"- Recall@10: {summary.get('mean_recall_at_10')}",
              f"- Recall@20: {summary.get('mean_recall_at_20')}",
              f"- MRR: {summary.get('mrr')}",
              f"- NDCG@10: {summary.get('mean_ndcg_at_10')}",
              f"- Phrase hit rate: {summary.get('exact_phrase_hit_rate')}",
              f"- Term coverage: {summary.get('mean_expected_term_coverage')}",
          ]
          with Path("$GITHUB_STEP_SUMMARY").open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
          fi

      - name: Upload retrieval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejnar-retrieval-baseline
          path: artifacts/ejnar-retrieval
          if-no-files-found: error
          retention-days: 30
